<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DAZBERY - 3D Virtual Luxury Store</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Overlays */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .interactive { pointer-events: auto; }
        
        /* Header */
        .brand-header { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid #333; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; border-radius: 12px; }
        .brand-title { font-size: 20px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: #fff; }
        .cart-summary { background: #fff; color: #000; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        
        /* Joysticks */
        .controls-area { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; padding-bottom: 10px; }
        .joystick-container { width: 120px; height: 120px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%; position: relative; touch-action: none; display: flex; justify-content: center; align-items: center; }
        .joystick-knob { width: 50px; height: 50px; background: #fff; border-radius: 50%; position: absolute; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.05s linear; }
        .controls-hint { background: rgba(0,0,0,0.7); color: #aaa; padding: 8px 14px; border-radius: 8px; font-size: 12px; text-align: center; border: 1px solid #333; }

        /* Modal Overlays */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; display: none; justify-content: center; align-items: center; pointer-events: auto; }
        .modal-card { background: #111; border: 1px solid #333; color: #fff; width: 90%; max-width: 400px; padding: 24px; border-radius: 16px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .modal-card h2 { margin-top: 0; letter-spacing: 1px; font-size: 22px; }
        .btn { background: #fff; color: #000; border: none; padding: 12px 24px; font-weight: 700; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px; font-size: 15px; transition: 0.2s; }
        .btn:hover { background: #ddd; }
        
        /* Scratch Card Canvas */
        #scratch-canvas { width: 100%; height: 100px; background: #ddd; border-radius: 8px; cursor: crosshair; margin: 15px 0; touch-action: none; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <div class="brand-header interactive">
            <div class="brand-title">DAZBERY</div>
            <div class="cart-summary">
                🛒 Cart: <span id="cart-count">0</span> items | <span id="cart-total">₹0</span>
            </div>
        </div>

        <div class="controls-area">
            <div id="move-stick" class="joystick-container interactive">
                <div id="move-knob" class="joystick-knob"></div>
            </div>
            <div class="controls-hint">
                <b>Move:</b> Left Joystick / WASD<br><b>Look:</b> Right Joystick / Drag
            </div>
            <div id="look-stick" class="joystick-container interactive">
                <div id="look-knob" class="joystick-knob"></div>
            </div>
        </div>
    </div>

    <!-- Modal for Product Interaction -->
    <div id="product-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="modal-title">Product Name</h2>
            <p id="modal-desc" style="color: #aaa; font-size: 14px;"></p>
            <p id="modal-price" style="font-size: 18px; font-weight: bold; color: #fff;"></p>
            <button class="btn" onclick="addToCartFromModal()">Add to Trolley</button>
            <button class="btn" style="background: #333; color: #fff;" onclick="closeModal()">Close</button>
        </div>
    </div>

    <!-- Modal for Billing Counter -->
    <div id="billing-modal" class="modal-overlay">
        <div class="modal-card">
            <h2>Cashier Checkout</h2>
            <p style="color: #aaa; font-size: 13px;">Scratch below to reveal your discount coupon!</p>
            <div style="position: relative;">
                <canvas id="scratch-canvas" width="350" height="100"></canvas>
                <div id="scratch-text" style="position: absolute; top: 35px; width: 100%; font-weight: bold; color: #000; font-size: 18px; pointer-events: none;">DAZBERY20 (20% OFF)</div>
            </div>
            <p id="bill-summary" style="font-size: 14px; margin: 10px 0;">Total: ₹0</p>
            <div style="display: flex; gap: 10px;">
                <button class="btn" style="background:#fff; color:#000;" onclick="pay('Card')">Swipe Card</button>
                <button class="btn" style="background:#222; color:#fff; border:1px solid #444;" onclick="pay('UPI')">GPay / UPI QR</button>
            </div>
            <button class="btn" style="background: transparent; color: #666; margin-top: 5px;" onclick="closeBilling()">Back to Store</button>
        </div>
    </div>

    <!-- Success Receipt Modal -->
    <div id="receipt-modal" class="modal-overlay">
        <div class="modal-card" style="background: #fff; color: #000;">
            <h2>DAZBERY RECEIPT</h2>
            <p style="font-size: 12px; color: #666;">Order Successfully Completed</p>
            <div id="receipt-details" style="text-align: left; font-size: 13px; margin: 15px 0; border-top: 1px dashed #ccc; border-bottom: 1px dashed #ccc; padding: 10px 0;"></div>
            <button class="btn" style="background: #000; color: #fff;" onclick="restartGame()">Continue Shopping</button>
        </div>
    </div>

    <!-- Include Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Basic Scene Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Lighting (Black & White Luxury Minimalist Tone)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(0, 10, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Store Floor & Ceiling
        const floorGeo = new THREE.PlaneGeometry(20, 30);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const ceilingGeo = new THREE.PlaneGeometry(20, 30);
        const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a });
        const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = 5;
        scene.add(ceiling);

        // Walls
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.9 });
        
        // Back Wall
        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(20, 5), wallMat);
        backWall.position.set(0, 2.5, -15);
        scene.add(backWall);

        // DAZBERY Signboard on back wall
        const signGeo = new THREE.PlaneGeometry(6, 1.2);
        const signCanvas = document.createElement('canvas');
        signCanvas.width = 600; signCanvas.height = 120;
        const ctx = signCanvas.getContext('2d');
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,600,120);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 50px Arial'; ctx.textAlign = 'center'; ctx.fillText('DAZBERY', 300, 75);
        
        const signTex = new THREE.CanvasTexture(signCanvas);
        const signMat = new THREE.MeshBasicMaterial({ map: signTex });
        const signboard = new THREE.Mesh(signGeo, signMat);
        signboard.position.set(0, 3.8, -14.9);
        scene.add(signboard);

        // Shelves Creation helper
        const shelves = [];
        function createShelf(x, z, rotY) {
            const shelfGroup = new THREE.Group();
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.5 });
            
            for(let i=0; i<3; i++) {
                const board = new THREE.Mesh(new THREE.BoxGeometry(4, 0.1, 1), frameMat);
                board.position.set(0, i * 1.2 + 0.5, 0);
                board.castShadow = true; board.receiveShadow = true;
                shelfGroup.add(board);
            }
            shelfGroup.position.set(x, 0, z);
            shelfGroup.rotation.y = rotY;
            scene.add(shelfGroup);
            return shelfGroup;
        }

        createShelf(-6, -8, Math.PI / 2); // Left Skincare Aisle
        createShelf(6, -8, -Math.PI / 2);  // Right Haircare Aisle

        // Products Database
        const productsData = [
            { id: 1, name: "Dazbery Shampoo (200 ml)", price: 499, desc: "Rosemary, Hibiscus & Coconut Milk", x: -5.8, z: -8 },
            { id: 2, name: "Scalp-Safe Conditioner (150 g)", price: 549, desc: "Oat, Aloe, Hyaluronic Acid & B5", x: -5.8, z: -6 },
            { id: 3, name: "Hair Growth Serum (30 ml)", price: 899, desc: "3% Redensyl, 4% Anagain, 3% Baicapil", x: 5.8, z: -8 },
            { id: 4, name: "Minimalist Sunscreen SPF 50", price: 649, desc: "Broad Spectrum, Non-Greasy", x: 5.8, z: -6 }
        ];

        const productMeshes = [];
        productsData.forEach(prod => {
            const geom = new THREE.BoxGeometry(0.4, 0.8, 0.4);
            const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
            const mesh = new THREE.Mesh(geom, mat);
            mesh.position.set(prod.x, 1.8, prod.z);
            mesh.castShadow = true;
            scene.add(mesh);
            productMeshes.push({ mesh: mesh, data: prod });
        });

        // Billing Counter Desk
        const deskGeo = new THREE.BoxGeometry(3, 1, 1.2);
        const deskMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.2 });
        const desk = new THREE.Mesh(deskGeo, deskMat);
        desk.position.set(0, 0.5, 8);
        scene.add(desk);

        // Player & Controls State
        let playerPos = { x: 0, z: 5 };
        let cameraAngle = 0;
        let cart = [];

        // Joystick Logic
        function setupJoystick(stickId, knobId, callback) {
            const stick = document.getElementById(stickId);
            const knob = document.getElementById(knobId);
            let active = false, startX = 0, startY = 0;

            stick.addEventListener('pointerdown', (e) => {
                active = true; startX = e.clientX; startY = e.clientY;
                stick.setPointerCapture(e.pointerId);
            });

            stick.addEventListener('pointermove', (e) => {
                if (!active) return;
                let dx = e.clientX - startX;
                let dy = e.clientY - startY;
                let dist = Math.hypot(dx, dy);
                let maxDist = 40;
                if (dist > maxDist) { dx *= maxDist / dist; dy *= maxDist / dist; }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                callback(dx / maxDist, dy / maxDist);
            });

            const endAction = (e) => {
                if (!active) return;
                active = false;
                knob.style.transform = `translate(0px, 0px)`;
                callback(0, 0);
            };
            stick.addEventListener('pointerup', endAction);
            stick.addEventListener('pointercancel', endAction);
        }

        let moveVector = { x: 0, y: 0 };
        let lookVector = { x: 0, y: 0 };

        setupJoystick('move-stick', 'move-knob', (x, y) => { moveVector = { x, y }; });
        setupJoystick('look-stick', 'look-knob', (x, y) => { lookVector = { x, y }; });

        // Keyboard support
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // Main Animation & Physics Loop
        function animate() {
            requestAnimationFrame(animate);

            // Movement Calculation
            let moveX = moveVector.x + (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
            let moveZ = moveVector.y + (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? -1 : 0);

            let speed = 0.08;
            let forward = new THREE.Vector3(Math.sin(cameraAngle), 0, Math.cos(cameraAngle));
            let side = new THREE.Vector3(Math.cos(cameraAngle), 0, -Math.sin(cameraAngle));

            playerPos.x += (forward.x * -moveZ + side.x * moveX) * speed;
            playerPos.z += (forward.z * -moveZ + side.z * moveX) * speed;

            // Boundaries
            playerPos.x = Math.max(-8, Math.min(8, playerPos.x));
            playerPos.z = Math.max(-12, Math.min(10, playerPos.z));

            // Camera Rotation via Look Joystick or Mouse Drag
            cameraAngle -= lookVector.x * 0.04;

            camera.position.set(playerPos.x, 1.6, playerPos.z);
            let lookTarget = new THREE.Vector3(
                playerPos.x + Math.sin(cameraAngle) * 10,
                1.6,
                playerPos.z + Math.cos(cameraAngle) * 10
            );
            camera.lookAt(lookTarget);

            // Check Proximity to Products
            productMeshesforEachCheck();

            // Check Proximity to Billing Counter
            if (playerPos.z > 6 && Math.abs(playerPos.x) < 2) {
                openBillingCounter();
                playerPos.z = 5.5; // push back slightly
            }

            renderer.render(scene, camera);
        }

        function productMeshesforEachCheck() {
            productMeshes.forEach(item => {
                let dist = Math.hypot(playerPos.x - item.data.x, playerPos.z - item.data.z);
                if (dist < 1.5) {
                    showProductModal(item.data);
                }
            });
        }

        let selectedProduct = null;
        function showProductModal(prod) {
            selectedProduct = prod;
            document.getElementById('modal-title').innerText = prod.name;
            document.getElementById('modal-desc').innerText = prod.desc;
            document.getElementById('modal-price').innerText = `₹${prod.price}`;
            document.getElementById('product-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('product-modal').style.display = 'none';
            playerPos.z += 1.0; // Step back
        }

        function addToCartFromModal() {
            if (!selectedProduct) return;
            cart.push(selectedProduct);
            updateCartUI();
            closeModal();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-total').innerText = `₹${total}`;
        }

        // Billing & Scratch Card Logic
        function openBillingCounter() {
            if (cart.length === 0) {
                alert("Your trolley is empty! Pick up some items first.");
                playerPos.z = 4;
                return;
            }
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('bill-summary').innerText = `Total Amount: ₹${total} (20% Discount applied via Scratch Card)`;
            document.getElementById('billing-modal').style.display = 'flex';
            initScratchCard();
        }

        function closeBilling() {
            document.getElementById('billing-modal').style.display = 'none';
            playerPos.z = 4;
        }

        function initScratchCard() {
            const canvas = document.getElementById('scratch-canvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#888';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#333';
            ctx.font = '20px Arial';
            ctx.fillText('SCRATCH HERE FOR 20% OFF', 40, 60);

            let scratching = false;
            canvas.onpointerdown = () => scratching = true;
            canvas.onpointerup = () => scratching = false;
            canvas.onpointermove = (e) => {
                if (!scratching) return;
                const rect = canvas.getBoundingClientRect();
                let x = e.clientX - rect.left;
                let y = e.clientY - rect.top;
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 20, 0, Math.PI * 2);
                ctx.fill();
            };
        }

        function pay(method) {
            document.getElementById('billing-modal').style.display = 'none';
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            let discounted = Math.round(total * 0.8);

            let html = `<b>Payment Mode:</b> ${method}<br><br>`;
            cart.forEach(i => html += `${i.name} - ₹${i.price}<br>`);
            html += `<br><b>Discount:</b> 20% OFF<br><b>Final Paid:</b> ₹${discounted}`;
            
            document.getElementById('receipt-details').innerHTML = html;
            document.getElementById('receipt-modal').style.display = 'flex';
        }

        function restartGame() {
            cart = [];
            updateCartUI();
            document.getElementById('receipt-modal').style.display = 'none';
            playerPos = { x: 0, z: 5 };
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
