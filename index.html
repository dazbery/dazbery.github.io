<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DAZBERY | Luxury 3D Boutique Experience</title>

  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #FDFBF7;
      --pink-soft: #f4d0d8;
      --pink-medium: #e8a5b8;
      --pink-deep: #B86B7D;
      --rose-gold: #D4A373;
      --text-main: #2A2421;
      --text-muted: #7A6F6B;
      --surface: #FFFFFF;
      --border-light: rgba(232, 165, 184, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #1a1a1a; color: var(--text-main); }

    /* 3D Canvas Viewport - Absolute full screen */
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* HUD Controls Layer */
    #hud-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }

    header {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-light);
    }

    .brand-logo-wrap { display: flex; flex-direction: column; }
    .brand-logo { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; letter-spacing: 3px; color: var(--text-main); }
    .brand-sub { font-size: 7px; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; }

    .nav-links { display: flex; gap: 20px; font-size: 12px; font-weight: 600; color: var(--text-main); }
    .nav-links span { cursor: pointer; }
    .nav-links span.active { border-bottom: 2px solid var(--text-main); padding-bottom: 2px; }

    .cart-pill { background: #2A2421; color: #FFF; padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; display: flex; gap: 6px; align-items: center; cursor: pointer; }

    .swipe-badge {
      position: absolute; top: 75px; left: 20px;
      background: rgba(42, 36, 33, 0.75); backdrop-filter: blur(6px); color: #FFF;
      padding: 6px 14px; border-radius: 20px; font-size: 11px; display: flex; align-items: center; gap: 6px;
    }

    /* Interactive Dual Joystick */
    #joystick-zone {
      position: absolute; bottom: 85px; left: 25px; width: 120px; height: 120px;
      background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.6); border-radius: 50%;
      pointer-events: auto; touch-action: none;
    }
    #joystick-knob {
      width: 44px; height: 44px; background: var(--pink-deep); border: 2px solid #FFF; border-radius: 50%;
      position: absolute; top: 38px; left: 38px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .btn-360 {
      position: absolute; bottom: 125px; left: 160px;
      background: rgba(42, 36, 33, 0.85); color: #FFF; width: 44px; height: 44px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; pointer-events: auto; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .bottom-dock {
      position: absolute; bottom: 25px; right: 25px;
      background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px);
      padding: 8px 20px; border-radius: 35px; display: flex; gap: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1); pointer-events: auto; border: 1px solid var(--border-light);
    }
    .dock-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; font-weight: 700; color: var(--text-muted); cursor: pointer; gap: 2px; }
    .dock-item span:first-child { font-size: 16px; }

    /* Action Trigger Button */
    #action-btn {
      position: absolute; bottom: 95px; right: 25px;
      background: linear-gradient(135deg, var(--pink-deep) 0%, #9E5263 100%);
      color: #FFF; border: none; padding: 12px 22px; border-radius: 30px;
      font-weight: 700; font-size: 12px; box-shadow: 0 8px 20px rgba(184, 107, 125, 0.4);
      pointer-events: auto; display: none; cursor: pointer;
    }

    /* Modal Styling */
    .modal-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
      z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; pointer-events: auto;
    }
    .modal-card { background: #FFF; border-radius: 20px; width: 100%; max-width: 440px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); position: relative; }
    .modal-close { position: absolute; top: 14px; right: 18px; background: none; border: none; font-size: 20px; cursor: pointer; color: #888; }
    
    .qty-picker { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 16px 0; }
    .qty-btn { width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--pink-soft); font-weight: 700; cursor: pointer; }

    .btn-primary { width: 100%; background: var(--pink-deep); color: #FFF; border: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; }

    /* Self Payment Screen */
    .self-monitor {
      background: #0D0D0D; color: #00FF66; font-family: 'Courier New', monospace;
      padding: 14px; border-radius: 10px; font-size: 11px; margin-bottom: 12px;
    }

    #toast {
      position: absolute; top: 70px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: #2A2421; color: #FFF; padding: 8px 18px; border-radius: 20px; font-size: 11px; font-weight: 600;
      opacity: 0; transition: all 0.3s ease; z-index: 200;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- 3D Canvas Viewport -->
  <div id="canvas-container"></div>

  <!-- HUD Overlay -->
  <div id="hud-overlay">
    <header>
      <div class="brand-logo-wrap">
        <div class="brand-logo">DAZBERY</div>
        <div class="brand-sub">Haircare • Naturally Yours</div>
      </div>
      <div class="nav-links">
        <span>Home</span>
        <span>Shop</span>
        <span class="active">3D Store</span>
        <span>About</span>
      </div>
      <div class="cart-pill" onclick="openCheckoutModal()">
        <span>🛒</span> <span id="cartCount">0</span>
      </div>
    </header>

    <div id="toast"></div>

    <div class="swipe-badge"><span>👆</span> Touch & Drag to Pan View</div>
    <div class="btn-360">360°</div>

    <!-- Joystick Move Control -->
    <div id="joystick-zone">
      <div id="joystick-knob"></div>
    </div>

    <button id="action-btn" onclick="handleActionTrigger()">Inspect Shelf</button>

    <div class="bottom-dock">
      <div class="dock-item" onclick="openCheckoutModal()">
        <span>🛒</span>
        <span>Trolley</span>
      </div>
      <div class="dock-item" onclick="openCheckoutModal()">
        <span>🛍️</span>
        <span>Bag</span>
      </div>
      <div class="dock-item" onclick="showToast('📦 Tracking Orders...')">
        <span>📋</span>
        <span>Orders</span>
      </div>
    </div>
  </div>

  <!-- PRODUCT INSPECT MODAL -->
  <div class="modal-overlay" id="inspectModal">
    <div class="modal-card" style="text-align:center;">
      <button class="modal-close" onclick="closeModal('inspectModal')">✕</button>
      <h3 id="inspectTitle" style="font-size:18px;">Product Title</h3>
      <p id="inspectPrice" style="font-size:20px; font-weight:800; color:var(--pink-deep); margin-top:6px;">₹599</p>

      <div class="qty-picker">
        <button class="qty-btn" onclick="updateQty(-1)">-</button>
        <span id="inspectQty" style="font-size:16px; font-weight:700;">1</span>
        <button class="qty-btn" onclick="updateQty(1)">+</button>
      </div>

      <button class="btn-primary" onclick="addInspectedToTrolley()">+ Drop into 3D Trolley</button>
    </div>
  </div>

  <!-- CHECKOUT MODAL -->
  <div class="modal-overlay" id="checkoutModal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal('checkoutModal')">✕</button>
      <h3 style="font-family:'Playfair Display',serif; font-size:18px; margin-bottom:10px;">Self Checkout Counter</h3>
      
      <div class="self-monitor" id="selfMonitorScreen">
        DAZBERY SELF-CHECKOUT MONITOR<br>
        ----------------------------<br>
        <div id="monitorItemList">Trolley Empty</div>
        ----------------------------<br>
        TOTAL PAY: ₹<span id="mTotal">0</span>
      </div>

      <button class="btn-primary" onclick="completePayment()">Pay & Print Receipt</button>
    </div>
  </div>

  <script>
    let trolley = [];
    let inspectQty = 1;
    let selectedItem = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // THREE.JS 3D REAL-TIME ENVIRONMENT ENGINE
    let scene, camera, renderer, trolleyGroup;
    let playerPos = { x: 0, z: 12 }, playerAngle = 0;
    let joystickActive = false, joyVec = { x: 0, y: 0 };
    let activeZone = null;

    function init3DStore() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xFDF7F4); // Warm Pink Store Atmosphere

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(playerPos.x, 2.2, playerPos.z);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // Warm Soft Lights
      scene.add(new THREE.AmbientLight(0xffece6, 1.1));
      const light = new THREE.DirectionalLight(0xfff5f0, 0.8);
      light.position.set(10, 20, 10);
      scene.add(light);

      // 3D Polished Marble Floor
      const floorMat = new THREE.MeshStandardMaterial({ color: 0xF3E6E1, roughness: 0.15 });
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 50), floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // Back Arch Wall & Gold DAZBERY Neon Logo
      const wallMat = new THREE.MeshStandardMaterial({ color: 0xFCEBE6 });
      const backWall = new THREE.Mesh(new THREE.BoxGeometry(40, 14, 0.5), wallMat);
      backWall.position.set(0, 7, -18);
      scene.add(backWall);

      const signMat = new THREE.MeshStandardMaterial({ color: 0x2A2421 });
      const sign = new THREE.Mesh(new THREE.BoxGeometry(10, 2.4, 0.3), signMat);
      sign.position.set(0, 9.5, -17.7);
      scene.add(sign);

      // Built-in Cosmetic Shelves (Left & Right)
      create3DShelf(-9, -6, 0xB86B7D);
      create3DShelf(9, -6, 0xE8A5B8);

      // Reception / Checkout Table
      const deskMat = new THREE.MeshStandardMaterial({ color: 0xE8A5B8 });
      const desk = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 3.5, 2, 32), deskMat);
      desk.position.set(0, 1.0, -10);
      scene.add(desk);

      // 3D PINK SHOPPING TROLLEY (Moves with Camera)
      create3DTrolleyMesh();

      setupJoystick();
      setupTouchLook();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate3D();
    }

    function create3DShelf(x, z, colorHex) {
      const group = new THREE.Group();
      const woodMat = new THREE.MeshStandardMaterial({ color: 0xD4A373 });
      const bottleMat = new THREE.MeshStandardMaterial({ color: colorHex });

      for (let i = 0; i < 4; i++) {
        const board = new THREE.Mesh(new THREE.BoxGeometry(5, 0.15, 1.4), woodMat);
        board.position.set(0, 1.2 + (i * 1.3), 0);
        group.add(board);

        for (let b = -1.8; b <= 1.8; b += 0.8) {
          const bottle = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.7, 12), bottleMat);
          bottle.position.set(b, 1.6 + (i * 1.3), 0);
          group.add(bottle);
        }
      }
      group.position.set(x, 0, z);
      scene.add(group);
    }

    function create3DTrolleyMesh() {
      trolleyGroup = new THREE.Group();
      const wireMat = new THREE.MeshStandardMaterial({ color: 0xE8A5B8, wireframe: true });
      const handleMat = new THREE.MeshStandardMaterial({ color: 0xB86B7D });

      const basket = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.9, 1.7), wireMat);
      basket.position.set(0, 0.9, -2.5);
      trolleyGroup.add(basket);

      const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.1), handleMat);
      handle.rotation.z = Math.PI / 2;
      handle.position.set(0, 1.3, -1.7);
      trolleyGroup.add(handle);

      scene.add(trolleyGroup);
    }

    function setupJoystick() {
      const zone = document.getElementById('joystick-zone');
      const knob = document.getElementById('joystick-knob');

      zone.addEventListener('touchstart', () => { joystickActive = true; });
      window.addEventListener('touchmove', (e) => {
        if (!joystickActive) return;
        const t = e.touches[0];
        const rect = zone.getBoundingClientRect();
        let dx = t.clientX - (rect.left + rect.width / 2);
        let dy = t.clientY - (rect.top + rect.height / 2);
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 35) { dx = (dx / dist) * 35; dy = (dy / dist) * 35; }
        knob.style.transform = `translate(${dx}px, ${dy}px)`;
        joyVec.x = dx / 35; joyVec.y = dy / 35;
      });

      window.addEventListener('touchend', () => {
        joystickActive = false;
        knob.style.transform = `translate(0px, 0px)`;
        joyVec = { x: 0, y: 0 };
      });
    }

    let touchX = 0;
    function setupTouchLook() {
      window.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; });
      window.addEventListener('touchmove', e => {
        let dx = e.touches[0].clientX - touchX;
        playerAngle -= dx * 0.004;
        touchX = e.touches[0].clientX;
      });
    }

    function animate3D() {
      requestAnimationFrame(animate3D);

      if (Math.abs(joyVec.x) > 0.1 || Math.abs(joyVec.y) > 0.1) {
        playerPos.x -= Math.sin(playerAngle) * joyVec.y * 0.12;
        playerPos.z -= Math.cos(playerAngle) * joyVec.y * 0.12;
      }

      camera.position.x = playerPos.x;
      camera.position.z = playerPos.z;
      camera.rotation.y = playerAngle;

      if (trolleyGroup) {
        trolleyGroup.position.x = playerPos.x;
        trolleyGroup.position.z = playerPos.z;
        trolleyGroup.rotation.y = playerAngle;
      }

      checkProximity();
      renderer.render(scene, camera);
    }

    function checkProximity() {
      const actBtn = document.getElementById('action-btn');
      const distLeft = Math.hypot(playerPos.x - (-9), playerPos.z - (-6));
      const distRight = Math.hypot(playerPos.x - 9, playerPos.z - (-6));
      const distDesk = Math.hypot(playerPos.x - 0, playerPos.z - (-10));

      if (distLeft < 4) {
        activeZone = 'leftShelf';
        actBtn.style.display = 'block';
        actBtn.innerText = '✨ Inspect Shampoo & Conditioner';
      } else if (distRight < 4) {
        activeZone = 'rightShelf';
        actBtn.style.display = 'block';
        actBtn.innerText = '💇‍♀️ Inspect Hair Serum Spray';
      } else if (distDesk < 4) {
        activeZone = 'desk';
        actBtn.style.display = 'block';
        actBtn.innerText = '🧾 Self Checkout Counter';
      } else {
        activeZone = null;
        actBtn.style.display = 'none';
      }
    }

    function handleActionTrigger() {
      if (activeZone === 'leftShelf') {
        selectedItem = { name: "DAZBERY Shampoo 200ml", price: 899 };
        openInspectModal();
      } else if (activeZone === 'rightShelf') {
        selectedItem = { name: "Rosemary Hair Spray", price: 599 };
        openInspectModal();
      } else if (activeZone === 'desk') {
        openCheckoutModal();
      }
    }

    function openInspectModal() {
      inspectQty = 1;
      document.getElementById('inspectTitle').innerText = selectedItem.name;
      document.getElementById('inspectPrice').innerText = '₹' + selectedItem.price;
      document.getElementById('inspectQty').innerText = inspectQty;
      openModal('inspectModal');
    }

    function updateQty(val) {
      inspectQty += val;
      if (inspectQty < 1) inspectQty = 1;
      document.getElementById('inspectQty').innerText = inspectQty;
    }

    function addInspectedToTrolley() {
      trolley.push({ name: selectedItem.name, price: selectedItem.price, qty: inspectQty });
      document.getElementById('cartCount').innerText = trolley.reduce((s, i) => s + i.qty, 0);
      closeModal('inspectModal');
      showToast(`✓ Dropped ${inspectQty}x ${selectedItem.name} into Trolley`);
    }

    function openCheckoutModal() {
      let html = '';
      let tot = 0;
      trolley.forEach(i => {
        tot += i.price * i.qty;
        html += `<div style="display:flex; justify-content:space-between;"><span>${i.qty}x ${i.name}</span><span>₹${i.price * i.qty}</span></div>`;
      });
      document.getElementById('monitorItemList').innerHTML = html || 'Trolley Empty';
      document.getElementById('mTotal').innerText = tot;
      openModal('checkoutModal');
    }

    function completePayment() {
      showToast('🖨️ Payment Successful! Receipt Printed.');
      closeModal('checkoutModal');
      trolley = [];
      document.getElementById('cartCount').innerText = '0';
    }

    window.onload = init3DStore;
  </script>
</body>
</html>
