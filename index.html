<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAZBERY | Premium Personal Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #fbfbfb;
      --surface: #ffffff;
      --text-main: #121212;
      --text-muted: #666666;
      --accent-gold: #c5a059;
      --border-color: #eee;
      --subtle-gray: #f4f4f4;
      --radius: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); line-height: 1.6; letter-spacing: -0.01em; }

    /* Top Bar */
    .announcement-bar {
      background: var(--text-main);
      color: var(--surface);
      text-align: center;
      padding: 9px 16px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Header */
    header {
      background: var(--surface);
      padding: 18px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { 
      font-size: 24px; 
      font-weight: 700; 
      letter-spacing: 4px; 
      color: var(--text-main); 
      text-transform: uppercase; 
    }
    nav a { text-decoration: none; color: var(--text-muted); font-weight: 500; font-size: 13px; margin-left: 24px; transition: 0.2s; }
    nav a:hover { color: var(--text-main); }

    /* Container */
    .container { max-width: 1080px; margin: 0 auto; padding: 40px 20px; }

    /* Hero Section */
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      background: var(--surface);
      padding: 32px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
    }

    .product-gallery { position: relative; }
    .product-main-img { width: 100%; border-radius: var(--radius); object-fit: cover; aspect-ratio: 1; display: block; background: var(--subtle-gray); }
    
    .coupon-banner-tag {
      position: absolute;
      top: 16px;
      left: 16px;
      background: var(--text-main);
      color: var(--surface);
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* Product Details */
    .brand-category { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
    .product-details h1 { font-size: 28px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; letter-spacing: -0.5px; }
    .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }

    .price-box {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }
    .price-offer { font-size: 26px; font-weight: 700; color: var(--text-main); }
    .price-original { font-size: 16px; text-decoration: line-through; color: var(--text-muted); display: none; }
    .prepaid-only-tag { background: var(--subtle-gray); color: var(--text-main); font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 4px; letter-spacing: 0.5px; }

    /* Coupon Input Box */
    .coupon-container {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .coupon-container input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      outline: none;
      background: var(--bg-main);
      color: var(--text-main);
    }
    .btn-apply-coupon {
      background: var(--text-main);
      color: var(--surface);
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 1px;
    }
    .coupon-msg { font-size: 12px; margin-bottom: 16px; font-weight: 500; display: none; }

    /* Order Form */
    .order-form { display: flex; flex-direction: column; gap: 12px; }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      background: var(--surface);
      color: var(--text-main);
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--text-main); }
    
    .btn-buy {
      background: var(--text-main);
      color: var(--surface);
      padding: 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
      text-align: center;
      text-transform: uppercase;
    }
    .btn-buy:hover { background: #2a2a2a; }

    /* Sections */
    .section-title { font-size: 20px; font-weight: 600; margin: 48px 0 24px; text-align: center; letter-spacing: -0.5px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }

    .card { background: var(--surface); padding: 24px; border-radius: var(--radius); border: 1px solid var(--border-color); }
    .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
    .card p { font-size: 13px; color: var(--text-muted); }

    /* Replacement / Damage Notice Box */
    .policy-notice-card {
      background: var(--surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      margin: 48px 0 24px;
    }
    .policy-notice-card h4 { font-size: 14px; color: var(--text-main); font-weight: 600; margin-bottom: 8px; letter-spacing: 0.5px; }
    .policy-notice-card p { font-size: 13px; color: var(--text-muted); }

    /* Reviews Section */
    .reviews-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }
    .review-item { background: var(--surface); padding: 20px; border-radius: var(--radius); border: 1px solid var(--border-color); }
    .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .review-user { font-weight: 600; font-size: 13px; color: var(--text-main); }
    .verified-badge { color: var(--text-muted); font-size: 11px; font-weight: 500; }
    .stars { color: var(--accent-gold); font-size: 12px; margin-bottom: 8px; }
    .review-text { font-size: 13px; color: var(--text-muted); }
